apiVersion: v1
kind: ServiceAccount
metadata:
  name: icos-audit-ac
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: icos-audit-cr
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch","create", "update", "patch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["configauditreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["sbomreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces","pods/log","pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["tracingpolicies","tracingpoliciesnamespaced"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"] 
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: icos-audit-ac
subjects:
  - kind: ServiceAccount
    name: icos-audit-ac
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: icos-audit-cr
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Secret
metadata:
  name: icos-audit-ac-token
  annotations:
    kubernetes.io/service-account.name: "icos-audit-ac"
type: kubernetes.io/service-account-token
